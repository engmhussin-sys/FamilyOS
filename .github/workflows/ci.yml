name: CI

# Runs Decision-014's pipeline automatically on every push/PR — this file
# IS the "part of the system itself" the review asked for. A red run here
# means the corresponding feature is a draft, per
# docs/development/definition_of_done.md, regardless of what anyone
# believes about it locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: afdc
          POSTGRES_PASSWORD: afdc_ci_password
          POSTGRES_DB: afdc_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U afdc -d afdc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://afdc:afdc_ci_password@localhost:5432/afdc_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-secret-32chars
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-secret-32ch
      # Separate names, deliberately: the integration suites REFUSE to run
      # (they skip loudly) unless these are set, so they can never
      # accidentally point at a developer's own database. Set here because
      # this job really does have a throwaway Postgres and Redis.
      # Without them, DA-002's concurrency proofs and SA-002's token-family
      # proof would be silently skipped in CI.
      INTEGRATION_DATABASE_URL: postgresql://afdc:afdc_ci_password@localhost:5432/afdc_ci?schema=public
      INTEGRATION_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Security audit (Sprint 9)
        run: npm audit --audit-level=high
        continue-on-error: true # informational for now — see docs/production/SECURITY_HARDENING.md §6 for the policy on when this becomes blocking
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Type check
        run: npx tsc --noEmit
      # F2 (R8) — BLOCKING. Static half of the tenant-isolation guard: fails the
      # build on an un-extended PrismaClient, on raw SQL that touches a
      # tenant-scoped table without mentioning family_id, on a client-supplied
      # familyId, and on any model in schema.prisma that has not been
      # classified in tenant-model-registry.ts.
      - name: Tenant-scoping static guard
        run: npm run ci:tenant-guard
      # F3 (R3) — BLOCKING. The ratchet described in
      # docs/architecture/EVENT_PIPELINE.md: a new module cannot write
      # child-achievement state without either emitting through the Outbox or
      # being added, by hand and with a written reason, to KNOWN_UNWIRED. It
      # also forbids writing the three event tables from outside the events
      # module. It deliberately does NOT claim to verify that an event is
      # emitted in the SAME transaction as the write — see the script's own
      # header for why that is not statically decidable here.
      - name: Event-emission static guard
        run: npm run ci:event-emission
      - name: Unit + DI-graph tests
        run: npx jest --testPathIgnorePatterns=test/database --testPathIgnorePatterns=test/tenancy --testPathIgnorePatterns=test/events --coverage
      - name: Database integration test
        run: npx jest test/database --forceExit
      # F2 (R8) — BLOCKING. Dynamic half: the deny-by-default proof, the RLS
      # proof, the R14 guard-coverage sweep over every controller, and the
      # GENERATED cross-tenant probe suite, which boots the real application,
      # registers two families over HTTP and replays every id-taking route with
      # family A's token against family B's resources, requiring 404.
      # Runs last because it is the slowest and the most informative when red.
      - name: Tenant isolation proofs (deny-by-default, RLS, cross-tenant probe)
        run: npx jest test/tenancy --forceExit --runInBand
      # F3 (R3) — BLOCKING. The event pipeline end to end against the real
      # PostgreSQL and the real Redis: a batch ingested over HTTP with a real
      # device token, the relay dispatching it, the Rewards Engine granting
      # once, exactly one notification, and the same batch replayed producing
      # zero new rewards and zero new notifications. --runInBand because the
      # suite owns the clock and the throttler counters in Redis.
      - name: Event pipeline proofs (ingest -> bus -> reward -> notification)
        run: npx jest test/events --forceExit --runInBand
      - name: Build
        run: npx nest build

  admin-dashboard:
    name: Admin Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin-dashboard/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  # =========================================================================
  # FLUTTER — PHASE C.
  #
  # This job used to be two hand-maintained copies (child-app, parent-app),
  # both with `continue-on-error` on `flutter analyze`, on `dart format` and
  # on `flutter test`, and neither building the parent APK at all. Every one
  # of those TODO(F2) markers is now discharged: the gate is strict, and it
  # lives in exactly ONE file so the two workflows cannot drift apart.
  #
  # .github/workflows/build-apk.yml is that file. It runs, for BOTH apps:
  #   flutter pub get -> flutter analyze -> flutter test
  #     -> flutter build apk --debug -> upload APK
  # fails on analyzer errors, test failures or build failures, and captures
  # the full output of every stage as an artifact and into the job summary so
  # that one run answers everything instead of stopping at the first error.
  #
  # `secrets: inherit` passes GOOGLE_SERVICES_JSON through when it exists. Its
  # absence no longer blocks the parent app — see that workflow's Firebase
  # step and apps/parent-app/android/app/build.gradle.
  # =========================================================================
  flutter:
    name: Flutter (parent-app + child-app)
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  docker:
    name: Docker Build (Sprint 9 — Production Image)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t afdc-backend:ci apps/backend
      # Not pushed anywhere from CI — this job's only job is to catch a
      # broken Dockerfile before it reaches a deploy step, per Sprint 9's
      # "Docker Production Readiness" requirement.

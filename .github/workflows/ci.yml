name: CI

# Runs Decision-014's pipeline automatically on every push/PR — this file
# IS the "part of the system itself" the review asked for. A red run here
# means the corresponding feature is a draft, per
# docs/development/definition_of_done.md, regardless of what anyone
# believes about it locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: afdc
          POSTGRES_PASSWORD: afdc_ci_password
          POSTGRES_DB: afdc_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U afdc -d afdc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://afdc:afdc_ci_password@localhost:5432/afdc_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-secret-32chars
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-secret-32ch
      # Separate names, deliberately: the integration suites REFUSE to run
      # (they skip loudly) unless these are set, so they can never
      # accidentally point at a developer's own database. Set here because
      # this job really does have a throwaway Postgres and Redis.
      # Without them, DA-002's concurrency proofs and SA-002's token-family
      # proof would be silently skipped in CI.
      INTEGRATION_DATABASE_URL: postgresql://afdc:afdc_ci_password@localhost:5432/afdc_ci?schema=public
      INTEGRATION_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Security audit (Sprint 9)
        run: npm audit --audit-level=high
        continue-on-error: true # informational for now — see docs/production/SECURITY_HARDENING.md §6 for the policy on when this becomes blocking
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit + DI-graph tests
        run: npx jest --testPathIgnorePatterns=test/database --coverage
      - name: Database integration test
        run: npx jest test/database --forceExit
      - name: Build
        run: npx nest build

  admin-dashboard:
    name: Admin Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin-dashboard/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  child-app:
    name: Child Agent (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/child-app
    steps:
      - uses: actions/checkout@v4

      # FIX 2 of 5 (audit §10.1): there was no setup-java step at all.
      # gradle-wrapper.properties pins Gradle 8.3, and Gradle could not run
      # on JDK 21 until 8.5 — so on a runner defaulting to 21 this job died
      # with "Unsupported class file major version 65" before compiling a
      # single line. Must come BEFORE flutter-action.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # FIX 1 of 5: `channel: stable` alone is unpinned, so the effective
      # Flutter version changed every fortnight. Flutter 3.27+ defaults
      # compileSdk to 35, which AGP 8.1.1 (settings.gradle) rejects outright.
      # See .github/workflows/build-apk.yml for the full version rationale.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - run: flutter pub get

      # FIX 4 of 5: was `--fatal-infos`, which fails on informational lints.
      # The tree has never been analyzed even once, so this starts
      # non-blocking to keep the rest of the pipeline observable.
      # TODO(F2): remove `continue-on-error` and restore `--fatal-infos`
      # once the analyzer reports zero. That flip is the real MA-001 gate.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # FIX 5 of 5: `dart format --set-exit-if-changed` failed with
      # certainty — 369 lines in this app exceed 80 characters (911 across
      # both apps, audit MA-014). Relaxed to a non-blocking report so it
      # surfaces the diff without blocking every commit.
      # TODO(F2): run `dart format .` once, commit the result, then restore
      # `--set-exit-if-changed` and drop `continue-on-error`. Formatting is
      # worth gating on — but only after a single normalising commit, not by
      # failing 911 pre-existing lines onto whoever pushes next.
      - name: Format check (reporting only — see comment)
        run: dart format --output=none .
        continue-on-error: true

      # Still expected to be red until the 58 cases are triaged; kept
      # non-blocking for now so the build step below is always reached.
      # TODO(F2): make blocking (MA-011).
      - name: Unit tests
        run: flutter test
        continue-on-error: true

      # HARD GATE — deliberately not tolerant.
      - name: Build (debug APK, no signing needed for CI verification)
        run: flutter build apk --debug

      # FIX 3 of 5: the job produced no artifact, so even a successful build
      # left nothing anyone could install.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-child-app-debug-${{ github.sha }}
          path: apps/child-app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  # FIX (audit MA-028): there was NO parent-app job at all — 6,388 lines and
  # 26 screens with zero CI coverage.
  #
  # The APK build itself lives in build-apk.yml because it needs the
  # GOOGLE_SERVICES_JSON secret (MA-015). This job covers everything that
  # does NOT need Firebase config: resolution, analysis, and tests. That is
  # most of the value and it runs on every PR, including from forks.
  parent-app:
    name: Parent App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - run: flutter pub get

      # TODO(F2): make blocking, as above.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Format check (reporting only — see child-app comment)
        run: dart format --output=none .
        continue-on-error: true

      # This app has ZERO test files today (audit §8). The step is here so
      # the first test someone writes is executed automatically rather than
      # needing a CI change too. `flutter test` exits non-zero when it finds
      # no tests, hence continue-on-error until the first one lands.
      # TODO(F2): make blocking once tests exist (MA-011).
      - name: Unit tests
        run: flutter test
        continue-on-error: true

  docker:
    name: Docker Build (Sprint 9 — Production Image)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t afdc-backend:ci apps/backend
      # Not pushed anywhere from CI — this job's only job is to catch a
      # broken Dockerfile before it reaches a deploy step, per Sprint 9's
      # "Docker Production Readiness" requirement.

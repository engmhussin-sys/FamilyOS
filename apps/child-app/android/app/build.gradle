plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    // RECOVERY NOTE (Sprint 17.3): namespace replaces the source
    // AndroidManifest.xml's own `package` attribute — confirmed absent
    // from the existing Manifest (modern AGP 8.x convention, matching
    // what this project's own MainActivity.kt package declaration
    // already uses: com.aifamilycoach.child_app).
    namespace "com.aifamilycoach.child_app"
    // ---------------------------------------------------------------
    // PA-M-016 — SDK LEVELS ARE PINNED TO LITERALS, NOT TO THE FLUTTER
    // VERSION.
    //
    // These were `flutter.compileSdkVersion` / `flutter.targetSdkVersion` /
    // `flutter.minSdkVersion`, which resolve from whatever Flutter SDK
    // happens to be installed. That makes the Android API levels a function
    // of a DATE rather than of this commit: Flutter 3.24.x resolves
    // compileSdk to 34, Flutter 3.27+ resolves it to 35, and AGP 8.1.1
    // (android/settings.gradle) refuses compileSdk > 34 outright with
    // "compileSdk 35 requires Android Gradle Plugin 8.6.0 or higher".
    //
    // The literals below are exactly what Flutter 3.24.5 — the version
    // .github/workflows/ci.yml and build-apk.yml pin — resolves to today,
    // so this is a no-op for the pinned toolchain and a hard stop for any
    // unpinned one. If a future Flutter bump is wanted, these three numbers
    // and the AGP version move together, in one reviewed commit.
    //
    // ndkVersion is deliberately LEFT on flutter.ndkVersion: its correct
    // literal cannot be verified without a Flutter SDK, and a wrong NDK pin
    // fails as an opaque download error rather than a legible one.
    // ---------------------------------------------------------------
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.aifamilycoach.child_app"
        // PHASE C, superseding the Sprint 17.3 recovery note that said this
        // was "deliberately flutter.minSdkVersion rather than guessing":
        // 21 is not a guess, it is exactly the value Flutter 3.24.5 (the
        // version both workflows pin) resolves flutter.minSdkVersion to.
        // Writing it down changes nothing about today's build and stops a
        // Flutter bump from silently moving it.
        //
        // The Manifest's android:foregroundServiceType="specialUse" on
        // ChildGuardForegroundService is an Android 14 (API 34) concept, but
        // it is a TARGET-level concern, not a minimum: MainActivity.kt's own
        // Build.VERSION.SDK_INT checks are what let this run below 34, and
        // targetSdk 34 below is what makes the specialUse declaration
        // meaningful. The first real build is still the thing that confirms
        // this — nothing here has been compiled.
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // RECOVERY NOTE: signing with the debug config so `flutter
            // build apk --release` doesn't immediately fail with no
            // signing config configured — matches Flutter's own
            // default template comment ("TODO: Add your own signing
            // config for the release build"). A real release signing
            // key is a deployment-time decision, not something to
            // invent here.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // RECOVERY NOTE: both confirmed as ACTUALLY imported by this app's
    // existing Kotlin source (grep-confirmed, not assumed) —
    // RuntimeWatchdogWorker.kt imports androidx.work.* (CoroutineWorker,
    // WorkManager, PeriodicWorkRequestBuilder, ExistingPeriodicWorkPolicy),
    // and RuntimeAlertNotifier.kt/ChildGuardForegroundService.kt import
    // androidx.core.app.* (NotificationCompat, NotificationManagerCompat,
    // PendingIntentCompat). Without these two dependencies, the existing
    // native code would fail to compile — this is a required recovery
    // addition, not a new feature.
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "androidx.core:core-ktx:1.13.1"
}

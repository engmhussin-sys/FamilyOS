org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP 9 — THE TWO FLAGS THAT KEEP THIS MODULE ON THE OLD, WORKING SHAPE.
#
# AGP 9 turns on BUILT-IN KOTLIN and a new DSL by default. With them on,
# `id "org.jetbrains.kotlin.android"` in settings.gradle conflicts and
# `android { kotlinOptions { } }` in app/build.gradle is gone. Flutter
# documents these two flags as the supported interim state while an app
# still applies the Kotlin plugin, which this one does:
#   docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/
#     for-app-developers  (read 2026-08-22)
#
# FOLLOW-UP, DELIBERATELY NOT DONE HERE: drop `kotlin-android`, replace
# `kotlinOptions { jvmTarget }` with a top-level
# `kotlin { compilerOptions { jvmTarget = ... } }`, then set
# `android.builtInKotlin=true`. That is a source change to two Gradle
# files that must be BUILT to mean anything, and this change had no
# Android SDK to build with. It is not urgent; the Play deadline is.
android.newDsl=false
android.builtInKotlin=false

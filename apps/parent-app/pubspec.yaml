name: parent_app
description: AI Family Digital Coach — Parent Application (Sprint 10 Foundation)
publish_to: "none"
# PHASE G — THE SINGLE SOURCE OF TRUTH FOR BOTH ANDROID VERSION FIELDS.
# `<name>+<code>`: `0.1.0` becomes versionName, `1` becomes versionCode.
# `flutter build` writes both halves into android/local.properties, which
# android/app/build.gradle reads — nothing else in this repository declares a
# version. The `+1` was previously ABSENT, so versionCode fell through to the
# hardcoded `1` in build.gradle; that fallback is now a hard failure for any
# release build, and CI overrides the code with a monotonic run number via
# ORG_GRADLE_PROJECT_abnyVersionCode.
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # CLOSES A REAL GAP (Master Completeness Audit): without this,
  # native Material widgets (showDatePicker, default Material
  # dialog button labels) never followed the app's actual language —
  # Directionality (main.dart) already handled text DIRECTION
  # correctly, but locale-dependent widget content is a separate
  # mechanism this SDK package provides.
  flutter_localizations:
    sdk: flutter
  # CLOSES audit MA-016 (language choice was lost on every restart).
  # Deliberately NOT flutter_secure_storage: the selected language is a
  # UI preference, not a secret, and the secure store is reserved for
  # the user's session tokens.
  shared_preferences: ^2.2.3
  # Same choice as apps/child-app, for the same reason: explicit ports,
  # explicit providers, no hidden service locator.
  flutter_riverpod: ^2.5.1
  # Same refresh-and-retry HTTP pattern as child-app's ApiClient and the
  # Admin Dashboard's httpClient.ts — see core/network/api_client.dart.
  dio: ^5.4.3
  # USER-actor session storage (access + refresh token). Distinct purpose
  # from child-app's SecureTokenStorage (DEVICE-actor tokens) even though
  # the mechanism is identical.
  flutter_secure_storage: ^9.2.2
  # Production Readiness Review follow-up: real connectivity detection —
  # was entirely absent, flagged as a mandatory-before-release gap.
  connectivity_plus: ^6.0.5
  # Design pass: a real, modern typeface for the Parent App — Inter is
  # the same font family category widely used by trustworthy,
  # premium-feeling fintech/parenting SaaS products (clean, highly
  # legible at small sizes, never feels playful or casual — the
  # opposite design goal from the Child App's Fredoka).
  google_fonts: ^6.2.1
  # Sprint 4 (Observability): CLOSES A REAL GAP flagged in the full-
  # project audit — zero crash reporting existed anywhere in either
  # Flutter app, meaning any real production crash would go entirely
  # undetected except via a user's own complaint. Sentry chosen over
  # Firebase Crashlytics for one concrete reason: it works identically
  # for both the Parent App (Flutter) and a future native-heavy Child
  # App surface, and its free tier is generous enough for this
  # project's current scale — not a strong technical requirement
  # either way, a reasonable default that can be swapped later.
  sentry_flutter: ^8.9.0
  # Sprint 5 (Push Notifications) — the client half of the backend
  # pipeline this same sprint built (PushNotificationService,
  # /pairing/parent-device/push-token). firebase_core is a required
  # transitive dependency for firebase_messaging, not optional.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.9
  lints: ^4.0.0

flutter:
  uses-material-design: true

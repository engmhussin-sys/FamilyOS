version: "3.9"

# Local development infrastructure only. Production deployment
# (Railway initially, per the project's technology decisions) uses
# managed Postgres/Redis — this file is not used in production.

services:
  postgres:
    image: postgres:15-alpine
    container_name: afdc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afdc
      POSTGRES_PASSWORD: afdc_dev_password
      POSTGRES_DB: afdc_dev
    ports:
      - "5432:5432"
    volumes:
      - afdc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afdc -d afdc_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: afdc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  afdc_postgres_data:
